# RXLauncher - builds for macOS, Linux and Windows.
# Runs only on demand (Actions tab > "Build RXLauncher" > Run workflow) or when a tag like v3.3.0 is pushed.
# Results are downloadable as artifacts on the run page. Nothing is published automatically.
name: Build RXLauncher

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos
            args: --mac dmg zip --x64 --arm64
          - os: ubuntu-latest
            name: linux
            args: --linux AppImage --x64
          - os: windows-latest
            name: windows
            args: --win nsis portable --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall also applies scripts/patch-helios.js (Java detection fix)
      - name: Install dependencies
        run: npm ci

      - name: Build
        shell: bash
        env:
          # No Apple/Windows signing certificate: build unsigned (macOS arm64 gets an ad-hoc signature).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder build ${{ matrix.args }} --publish never -c.portable.artifactName='RXLauncher-Portable-${version}.${ext}'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rxlauncher-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
