<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RXLauncher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #0b0d13;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        /* Ambient Dark Vignette */
        .splash-vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(5, 7, 11, 0.8) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Frosted Optical Glass Card */
        .splash-card {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            background: linear-gradient(145deg, rgba(18, 24, 38, 0.88) 0%, rgba(12, 16, 26, 0.94) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 38px 46px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 
                        0 24px 60px -8px rgba(0, 0, 0, 0.70);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            min-width: 320px;
        }

        .logo-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-glow {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(47, 91, 234, 0.40) 0%, transparent 70%);
            filter: blur(18px);
            animation: pulseGlow 2.4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.08); }
        }

        .logo-img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            animation: logoIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.8);
            filter: drop-shadow(0 8px 20px rgba(47, 91, 234, 0.45));
        }

        @keyframes logoIn {
            to { opacity: 1; transform: scale(1); }
        }

        .brand-meta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            animation: fadeUp 0.6s 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(6px);
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #f8fafc;
            text-transform: uppercase;
        }

        .brand-badge {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #3b82f6;
            text-transform: uppercase;
            background: rgba(47, 91, 234, 0.12);
            border: 1px solid rgba(47, 91, 234, 0.30);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .progress-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 240px;
            animation: fadeUp 0.6s 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(6px);
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.50);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2F5BEA, #3b82f6);
            border-radius: 4px;
            transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 10px rgba(47, 91, 234, 0.6);
        }

        .progress-label {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .corner-badge {
            position: fixed;
            bottom: 12px;
            right: 14px;
            font-size: 10px;
            color: #64748b;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="splash-vignette"></div>

    <div class="splash-card">
        <div class="logo-wrap">
            <div class="logo-glow"></div>
            <img class="logo-img" src="assets/images/icon/icon.png" alt="RXCORP" 
                 onerror="this.style.display='none'">
        </div>

        <div class="brand-meta">
            <div class="brand-title">RXLAUNCHER</div>
            <div class="brand-badge">RXCORP CLOUD SYNC</div>
        </div>

        <div class="progress-box">
            <div class="progress-track">
                <div class="progress-fill" id="splash-progress"></div>
            </div>
            <div class="progress-label" id="splash-label">Démarrage...</div>
        </div>
    </div>

    <div class="corner-badge">rxcorp.me</div>

    <script>
        const progressEl = document.getElementById('splash-progress');
        const labelEl = document.getElementById('splash-label');

        let isFinished = false;

        window.completeSplash = function() {
            if (isFinished) return;
            isFinished = true;
            if (progressEl) progressEl.style.width = '100%';
            if (labelEl) labelEl.textContent = 'Prêt ! Lancement...';
        };

        const steps = [
            { pct: 30, label: 'Chargement des composants...' },
            { pct: 60, label: 'Synchronisation Cloud RXCORP...' },
            { pct: 85, label: 'Vérification du moteur RXSync...' },
            { pct: 100, label: 'Prêt ! Lancement...' }
        ];

        let i = 0;
        function nextStep() {
            if (isFinished) return;
            if (i < steps.length) {
                const s = steps[i++];
                if (progressEl) progressEl.style.width = s.pct + '%';
                if (labelEl) labelEl.textContent = s.label;
                if (s.pct === 100) {
                    isFinished = true;
                } else {
                    setTimeout(nextStep, 240 + Math.random() * 100);
                }
            }
        }

        setTimeout(nextStep, 120);
    </script>
</body>
</html>
